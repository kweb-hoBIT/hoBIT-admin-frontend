<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/hoBIT32.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 나이트 모드: 저장값 > 시스템 설정. 화면을 그리기 전에 적용해 흰 화면 깜빡임 방지 (호빗 사용자 화면과 같은 키) -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('hobit-theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1e1e22' : '#ffffff');
      })();
    </script>
    <!-- 첫 로딩 화면 (자바스크립트 준비 전) — 호빗 사용자 화면과 같은 호빗 캐릭터. React가 그려지면 #root 내용이 바뀜 -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/hobit-splash.png" fetchpriority="high" />
    <style>
      html { background: #f7f7f8; }
      html.dark { background: #111113; }
      .hobit-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #f7f7f8; color: #750e21;
        font-family: 'Freesentation-8ExtraBold', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      }
      html.dark .hobit-splash { background: #111113; color: #de8c9a; }
      /* 호빗 캐릭터 — 이미지가 오기 전에도 같은 자리에 연한 원이 보여 화면이 밀리지 않음 */
      .hobit-splash__char {
        width: 96px; height: 96px; border-radius: 50%; background: #fde3dc; display: block;
        animation: hobit-splash-in 0.4s ease-out both, hobit-splash-bob 1.6s ease-in-out 0.4s infinite;
      }
      html.dark .hobit-splash__char { background: #2a2326; }
      .hobit-splash__shadow { width: 56px; height: 8px; margin-top: -10px; border-radius: 50%; background: currentColor; opacity: 0.12;
        animation: hobit-splash-shadow 1.6s ease-in-out 0.4s infinite; }
      .hobit-splash__mark { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; animation: hobit-splash-in 0.4s ease-out 0.1s both; }
      .hobit-splash__dots { display: flex; gap: 7px; margin-top: -8px; opacity: 0; animation: hobit-splash-in 0.3s ease-out 0.2s both; }
      .hobit-splash__dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.25; animation: hobit-splash-dot 1.2s ease-in-out infinite; }
      .hobit-splash__dots i:nth-child(2) { animation-delay: 0.15s; }
      .hobit-splash__dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes hobit-splash-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes hobit-splash-bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-5px) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(0deg); } 75% { transform: translateY(-5px) rotate(3deg); } }
      @keyframes hobit-splash-shadow { 0%, 100% { transform: scaleX(1); opacity: 0.12; } 50% { transform: scaleX(0.75); opacity: 0.06; } }
      @keyframes hobit-splash-dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
            /* 화면 이동 로딩 — 헤더(z-40) 밑, 본문 위 */
      .hobit-splash--nav { z-index: 30; padding-top: 64px; animation: hobit-splash-fade 0.15s ease-out both; }
      @keyframes hobit-splash-fade { from { opacity: 0; } to { opacity: 1; } }
      #boot-splash { z-index: 2147483000; transition: opacity 0.25s ease-out; }
      #boot-splash.hobit-splash--out { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .hobit-splash__char, .hobit-splash__shadow, .hobit-splash__mark, .hobit-splash__dots, .hobit-splash__dots i { animation: none !important; opacity: 1; }
        .hobit-splash__shadow { opacity: 0.12; }
      }
    </style>
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
    <meta
      name="description"
      content="호빗(hoBIT) 관리자 사이트"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>호빗 관리자 사이트</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- 첫 로딩 화면 — React와 따로 두고, 첫 화면의 데이터까지 다 받으면 src/bootSplash.ts가 걷음 -->
    <div id="boot-splash" class="hobit-splash" role="status" aria-label="관리자 사이트를 불러오는 중">
      <img class="hobit-splash__char" src="%PUBLIC_URL%/hobit-splash.png" width="96" height="96" alt="" />
      <div class="hobit-splash__shadow" aria-hidden="true"></div>
      <div class="hobit-splash__mark">hoBIT admin</div>
      <div class="hobit-splash__dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
